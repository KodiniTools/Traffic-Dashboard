# Traffic Dashboard - Nginx Configuration
# Kopiere diese Datei nach: /etc/nginx/sites-available/traffic-dashboard
# Dann: sudo ln -s /etc/nginx/sites-available/traffic-dashboard /etc/nginx/sites-enabled/
# Oder füge diesen server-Block zu einer bestehenden Konfiguration hinzu

server {
    listen 80;
    server_name dashboard.kodinitools.com;  # Anpassen oder als Subdomain nutzen

    # Weiterleitung zu HTTPS (empfohlen)
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name dashboard.kodinitools.com;

    # SSL-Zertifikate (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/dashboard.kodinitools.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dashboard.kodinitools.com/privkey.pem;

    # SSL-Konfiguration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;

    # Frontend (statische Dateien)
    root /var/www/traffic-dashboard/frontend/dist;
    index index.html;

    # SPA Routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API Proxy zum Backend
    location /api {
        proxy_pass http://127.0.0.1:3847;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Health Check
    location /health {
        proxy_pass http://127.0.0.1:3847;
    }

    # Sicherheitsheader
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 256;
}

